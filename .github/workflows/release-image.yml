name: Release container image

on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: release-image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  image:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/toymen/funnel
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Bier-Schneider Recruiting (Harly-Fork)
            org.opencontainers.image.description=Self-hosted applicant tracking system
            org.opencontainers.image.licenses=MIT
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Zielplattform ist der Raspberry Pi (arm64). Versions-Tags bauen
          # zusätzlich amd64 für Tests auf einem normalen Server/PC.
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/arm64' || 'linux/amd64,linux/arm64' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Scan published image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/toymen/funnel@${{ steps.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Block fixed CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/toymen/funnel@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
  release-manifest:
    # Nur im Original-Repo: synchronisiert die Harly-CLI-Release-Assets.
    if: github.repository == 'Vytral/harly' && startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync the published image into deployment assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          version="${RELEASE_VERSION#v}"
          node tooling/harly/scripts/sync-release-assets.mjs --version "$version" --digest "$RELEASE_DIGEST"
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-manifest.json fly.toml deploy/digitalocean/app.template.yaml deploy/railway/README.md tooling/harly/src/release.ts
          git commit -m "chore(release): sync deployment assets for $version [skip ci]"
          git push origin HEAD:main
